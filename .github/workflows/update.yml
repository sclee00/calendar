name: 빈자리 업데이트

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["data/korea.json"]   # 집 컴퓨터가 칸피싱·제일 데이터를 올리면 바로 합침

permissions:
  contents: write

concurrency:
  group: seats-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/scrape.mjs
      - name: 변경 내용 저장
        run: |
          git config user.name "seat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seats.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "빈자리 업데이트 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          git pull --rebase -q origin main && git push
