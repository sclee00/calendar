name: PC 버전 만들기
# pc/ 폴더가 바뀌거나 직접 실행하면 Windows·Mac 실행 파일을 만들어 Releases에 올린다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pc/**", ".github/workflows/pc-release.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 빌드
        run: bash pc/build.sh
      - name: Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pc-v1.0.${{ github.run_number }}"
          # 이전 PC 버전 릴리스는 지운다 (최신 하나만 남김)
          gh release list --repo "${{ github.repository }}" --limit 50 --json tagName --jq '.[].tagName' \
            | grep '^pc-v' | while read -r t; do gh release delete "$t" --repo "${{ github.repository }}" --cleanup-tag --yes || true; done
          cd pc/dist
          gh release create "$tag" --repo "${{ github.repository }}" --latest \
            --title "PC 버전 ${tag#pc-v}" \
            --notes "Windows: fishing-seats.exe(낚시배 빈자리)를 받아 실행하세요. Mac: Apple 칩은 -mac-apple, 인텔은 -mac-intel. 설명은 pc/README.md" \
            "fishing-seats.exe" "fishing-seats-mac-apple" "fishing-seats-mac-intel"
