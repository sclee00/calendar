name: 접속 진단
on: { workflow_dispatch: {} }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in khanfishing.com jnaksi.com lukina.sunsang24.com; do
            echo "=== $h"; curl -sS -o /dev/null -w "%{http_code} %{remote_ip} %{time_total}s\n" --max-time 20 "https://$h/" || true
            echo | openssl s_client -connect $h:443 -servername $h 2>&1 | grep -E "Verify return|depth=|verify error" | head -6 || true
          done
